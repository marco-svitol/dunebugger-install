# NATS Server Security Configuration
# Place this file in /opt/dunebugger-remote/config/nats/nats.conf

# Basic server settings
port: 4222
monitor_port: 8222

# Authentication - Token-based (simple but secure for LAN)
authorization {
    # Change this token to a strong random value
    token: "dunebugger_secure_token_change_me_123456789"
}

# Alternative: Username/Password authentication
# authorization {
#     users = [
#         {user: "dunebugger", password: "your_secure_password_here"}
#         {user: "scheduler", password: "another_secure_password"}
#     ]
# }

# Logging configuration
log_file: "/tmp/nats-server.log"
logtime: true
debug: false
trace: false

# Connection limits and timeouts
max_connections: 100
max_payload: 1048576  # 1MB max message size

# Prevent unauthorized clients
ping_interval: "30s"
ping_max: 3

# Monitoring security (restrict to localhost only)
http_port: 8222
https_port: 8223  # Optional HTTPS monitoring

# Rate limiting
max_pending: 67108864  # 64MB pending data per connection

# Disable certain features for security
no_auth_user: ""  # Disable anonymous access

# Optional: TLS Configuration (uncomment and configure certificates)
# tls {
#     cert_file: "/etc/nats/certs/server.crt"
#     key_file: "/etc/nats/certs/server.key"
#     ca_file: "/etc/nats/certs/ca.crt"
#     verify: true
#     timeout: 3
# }